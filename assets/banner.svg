<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"
     role="img" aria-labelledby="t d">
  <title id="t">OpenRouter Provider Routing — a Hermes Agent plugin</title>
  <desc id="d">One model on the left fans out to the upstream providers OpenRouter can route it to.
    google-vertex is selected, two others are available, and anthropic is excluded.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e38"/>
      <stop offset="0.55" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#141426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFBF00" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#FFBF00" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFBF00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CD7F32"/>
      <stop offset="1" stop-color="#CD7F32" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFF8DC" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#CD7F32" fill-opacity="0.55"/>

  <!-- ── left: identity ─────────────────────────────────────────────────── -->

  <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="3.4" fill="#CD7F32">HERMES AGENT PLUGIN</text>

  <text x="72" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" letter-spacing="-1" fill="#FFD700">OpenRouter</text>
  <text x="72" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" letter-spacing="-1" fill="#FFF8DC">Provider Picker</text>

  <text x="72" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="17" fill="#B9B9CC">Choose which upstream provider serves each model.</text>

  <rect x="72" y="302" width="392" height="1" fill="url(#rule)"/>

  <text x="72" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="2.6" fill="#6E6E86">WRITTEN TO CONFIG.YAML</text>

  <!-- Explicit x per line: SVG collapses leading spaces inside <text>. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="72"  y="374" fill="#8A8A9E">provider_routing:</text>
    <text x="88"  y="396" fill="#8A8A9E">models:</text>
    <text x="104" y="418" fill="#DAA520">"claude-fable-5.2":</text>
    <text x="120" y="440" fill="#8A8A9E">only: <tspan fill="#FFBF00">[google-vertex]</tspan></text>
  </g>

  <!-- ── right: one model, four upstreams ───────────────────────────────── -->

  <text x="866" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9.5" letter-spacing="1.8" fill="#6E6E86">UPSTREAM PROVIDERS</text>

  <g>
    <rect x="866" y="130" width="200" height="28" rx="14" fill="#FFBF00" fill-opacity="0.08"
          stroke="#CD7F32" stroke-opacity="0.75"/>
    <circle cx="884" cy="144" r="3" fill="#FFBF00"/>
    <text x="895" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#DAA520">only: [google-vertex]</text>
  </g>

  <!-- model node, vertically centred on the bus -->
  <g>
    <rect x="612" y="274" width="180" height="48" rx="8" fill="#232347" stroke="#3F3F60" stroke-width="1.2"/>
    <text x="628" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="9.5" letter-spacing="1.8" fill="#8A8A9E">MODEL</text>
    <text x="628" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" fill="#FFF8DC">claude-fable-5.2</text>
  </g>

  <!-- bus: one trunk, four stubs -->
  <g stroke="#3F3F60" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M792 298H818"/>
    <path d="M818 208V388"/>
    <path d="M818 208H866"/>
    <path d="M818 268H866"/>
    <path d="M818 328H866"/>
    <path d="M818 388H866"/>
  </g>

  <!-- row 1 · selected -->
  <g transform="translate(0,186)">
    <rect x="866" y="0" width="262" height="44" rx="6" fill="#2A2A48" stroke="#FFBF00" stroke-width="1.6"/>
    <rect x="882" y="14" width="16" height="16" rx="4" fill="#FFBF00"/>
    <path d="M885.5 22.5l2.8 2.8 5.4-5.8" fill="none" stroke="#1a1a2e" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#FFF8DC">google-vertex</text>
    <text x="1112" y="27" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10" fill="#9A8A5A">$8.00/M</text>
  </g>

  <!-- row 2 · available -->
  <g transform="translate(0,246)">
    <rect x="866" y="0" width="262" height="44" rx="6" fill="#1D1D33" stroke="#34344E" stroke-width="1.2"/>
    <rect x="882" y="14" width="16" height="16" rx="4" fill="none" stroke="#4A4A66" stroke-width="1.4"/>
    <text x="912" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#7C7C92">amazon-bedrock</text>
  </g>

  <!-- row 3 · available -->
  <g transform="translate(0,306)">
    <rect x="866" y="0" width="262" height="44" rx="6" fill="#1D1D33" stroke="#34344E" stroke-width="1.2"/>
    <rect x="882" y="14" width="16" height="16" rx="4" fill="none" stroke="#4A4A66" stroke-width="1.4"/>
    <text x="912" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#7C7C92">azure</text>
  </g>

  <!-- row 4 · excluded -->
  <g transform="translate(0,366)">
    <rect x="866" y="0" width="262" height="44" rx="6" fill="#1B1B2F" stroke="#3A2A32" stroke-width="1.2"/>
    <rect x="882" y="14" width="16" height="16" rx="4" fill="none" stroke="#5A4048" stroke-width="1.4"/>
    <path d="M885.5 17.5l9 9M894.5 17.5l-9 9" stroke="#EF5350" stroke-opacity="0.75" stroke-width="1.6"
          stroke-linecap="round"/>
    <text x="912" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#6E6E86">anthropic</text>
    <path d="M911 21.5H981" stroke="#EF5350" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="1112" y="27" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10" fill="#7A7A8E">ignored</text>
  </g>

  <!-- ── footer ─────────────────────────────────────────────────────────── -->

  <rect x="72" y="492" width="1056" height="1" fill="#2E2E48"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E6E86">
    <text x="72" y="524">openrouter.ai/api/v1/models</text>
    <text x="72" y="546">live catalog · per-model allow, deny or order · no API key</text>
    <text x="1128" y="524" text-anchor="end">Applied per request by Hermes</text>
    <text x="1128" y="546" text-anchor="end">Settings › Plugins › Provider Routing</text>
  </g>
</svg>
