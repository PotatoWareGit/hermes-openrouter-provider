name: openrouter-provider-picker          # matches plugin.yaml, and the runtime id in desktop/plugin.js
repo: https://github.com/PotatoWareGit/hermes-openrouter-provider
sha: afba3e648ecbfd18688f845e9f3ec7cf86315ff5
description: >-
  Pick which upstream providers serve each OpenRouter model, per model, from a
  desktop UI (Settings ▸ Plugins ▸ Provider Routing) or an agent tool. Writes
  provider_routing and provider_routing.models.<id> into the active profile's
  config.yaml — the keys Hermes already sends as OpenRouter's `provider` request
  field, and which `hermes config set` cannot address because model ids contain
  dots. The UI lists each model's real upstream providers with their context
  window and input price, and supports a whitelist, a blacklist, and a per-model
  sort override. OpenRouter only (Nous Portal ignores caller routing).
  Disclosure — network calls to the public, unauthenticated openrouter.ai API
  (/models and /models/<id>/endpoints) to build the model and provider lists,
  cached in-process; reads and rewrites config.yaml in the active profile; no
  telemetry, no credentials, no third-party services beyond OpenRouter.
maintainer: PotatoWareGit
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/PotatoWareGit/hermes-openrouter-provider#readme
